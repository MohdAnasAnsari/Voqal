apiVersion: apps/v1
kind: Deployment
metadata:
  name: voqal-redis
  namespace: voice-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voqal-redis
  template:
    metadata:
      labels:
        app: voqal-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: voqal-redis
  namespace: voice-ai
spec:
  selector:
    app: voqal-redis
  ports:
    - port: 6379
      targetPort: 6379
