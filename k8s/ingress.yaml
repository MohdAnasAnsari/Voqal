apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voqal-ingress
  namespace: voice-ai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
    # Replace with your actual hostname
    - host: app.voqal.local
      http:
        paths:
          # Frontend — catch-all
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voqal-frontend
                port:
                  number: 80
          # Backend API — proxied to FastAPI
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: voqal-backend
                port:
                  number: 8000
          # OpenAPI docs
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: voqal-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: voqal-backend
                port:
                  number: 8000
