# IMPORTANT: Replace every <base64-encoded-value> before applying.
# Encode a value: echo -n "my-secret" | base64
#
# kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: voqal-secrets
  namespace: voice-ai
type: Opaque
data:
  # Database credentials
  POSTGRES_USER:     dm9xYWxfdXNlcg==        # voqal_user
  POSTGRES_PASSWORD: dm9xYWxfcGFzc3dvcmQ=    # voqal_password
  POSTGRES_DB:       dm9xYWxfZGI=            # voqal_db

  # Application secrets (replace with real values)
  SECRET_KEY:        <base64-encoded-value>
  ENCRYPTION_KEY:    <base64-encoded-value>

  # AI / LLM
  GROQ_API_KEY: <base64-encoded-value>

  # CRM
  HUBSPOT_API_KEY:          <base64-encoded-value>
  SALESFORCE_CLIENT_ID:     <base64-encoded-value>
  SALESFORCE_CLIENT_SECRET: <base64-encoded-value>

  # Voice provider
  VOICE_PROVIDER_API_KEY: <base64-encoded-value>
