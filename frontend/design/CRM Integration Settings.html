<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice AI Agent — CRM Integration</title>

    <link rel="stylesheet" href="styles/colors_and_type.css" />
    <link rel="stylesheet" href="styles/primitives.css" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: var(--sot-black);
        color: var(--sot-fg-1);
        font-family: var(--sot-font-text);
        min-height: 100vh;
      }
      *, *::before, *::after { box-sizing: border-box; }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--sot-ink); }
      ::-webkit-scrollbar-thumb { background: var(--sot-line-strong); border-radius: 0; }
      ::-webkit-scrollbar-thumb:hover { background: var(--sot-fg-4); }

      @keyframes sotPing {
        0%   { transform: scale(1);   opacity: 0.6; }
        80%  { transform: scale(2.6); opacity: 0; }
        100% { transform: scale(2.6); opacity: 0; }
      }
      @keyframes sotSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      input[type="range"] { height: 4px; }
      select option {
        background: var(--sot-surface-2);
        color: var(--sot-fg-1);
      }

      .sot-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      @media (max-width: 1100px) {
        .settings-grid {
          grid-template-columns: 1fr !important;
        }
      }

      #root:empty::before {
        content: "Loading…";
        display: block;
        padding: 48px;
        font-family: var(--sot-font-mono);
        color: var(--sot-fg-3);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Lucide icons (pinned UMD build) -->
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

    <!-- React + Babel (pinned) -->
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="CRMIntegrationSettingsPage.jsx"></script>
  </body>
</html>
